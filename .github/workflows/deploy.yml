# Push or merge to main → type-check → deploy to the Bikriup VM (www.mudkraft.com).
# The SSH key in DEPLOY_SSH_KEY can only start /usr/local/bin/mudkraft-deploy on the server
# (forced command, no shell, no forwarding). The commit is streamed to it as a git bundle; the
# server builds it with its own settings (/etc/mudkraft.env), so no secret lives in GitHub.
# It switches to the new release, checks /api/health and rolls back on failure.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack this commit
        run: git bundle create "$RUNNER_TEMP/main.bundle" HEAD
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Say plainly which secret is missing, instead of an opaque SSH failure.
          [ -n "$SSH_KEY" ] || { echo "::error::GitHub secret DEPLOY_SSH_KEY is not set (see SEO-PLAN.md, section 0)"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::GitHub secret DEPLOY_KNOWN_HOSTS is not set (see SEO-PLAN.md, section 0)"; exit 1; }
          [ -n "$HOST" ] || { echo "::error::GitHub secret DEPLOY_HOST is not set (see SEO-PLAN.md, section 0)"; exit 1; }
          install -m 700 -d ~/.ssh
          # The secret may hold the key as pasted (BEGIN/END lines) or as one line of base64, which a
          # web form cannot mangle: `base64 -w0 ~/.ssh/mudkraft_deploy`. Windows line endings are stripped.
          if printf '%s' "$SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s' "$SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          # The fingerprint is public: compare it with `ssh-keygen -lf ~/.ssh/mudkraft_deploy.pub` on your machine.
          FP=$(ssh-keygen -y -f ~/.ssh/deploy_key 2>/dev/null | ssh-keygen -lf - 2>/dev/null) || {
            echo "::error::DEPLOY_SSH_KEY is not a valid private key. Set it to the one-line output of: base64 -w0 ~/.ssh/mudkraft_deploy"
            exit 1
          }
          echo "::notice::Deploy key in use: $FP"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$HOST" < "$RUNNER_TEMP/main.bundle" 2> "$RUNNER_TEMP/ssh.err" || {
            echo "::error::Deploy failed. SSH said: $(tail -3 "$RUNNER_TEMP/ssh.err" | tr '\n' ' ')"
            exit 1
          }
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
